<header class="barra">
  <div class="contenedor fila">
    <app-logo [destino]="sesion.activa() ? '/explorar' : '/'" />

    @if (sesion.activa()) {
      <nav class="secciones oculto-movil" aria-label="Secciones">
        @for (s of secciones; track s.ruta) {
          <a [routerLink]="s.ruta" routerLinkActive="activa" ariaCurrentWhenActive="page">{{ s.texto }}</a>
        }
      </nav>
      <div class="usuario">
        <span class="avatar" aria-hidden="true">{{ sesion.inicial() }}</span>
        <span class="nombre oculto-movil">{{ sesion.primerNombre() }}</span>
        <button class="btn btn-chico" (click)="salir()">Cerrar sesión</button>
      </div>
    } @else {
      <div class="usuario">
        <a class="btn btn-chico" routerLink="/login">Iniciar sesión</a>
        <a class="btn btn-chico btn-primario" routerLink="/registro">Crear cuenta</a>
      </div>
    }
  </div>
</header>

@if (sesion.activa()) {
  <nav class="inferior" aria-label="Secciones">
    @for (s of secciones; track s.ruta) {
      <a [routerLink]="s.ruta" routerLinkActive="activa" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path [attr.d]="s.icono" /></svg>
        <span>{{ s.corto }}</span>
      </a>
    }
  </nav>
}
